name: xwatch

# 抓取在 GitHub 的境外 runner 上跑（x.com / fxtwitter 直连），
# 推送打到自己国内服务器的 ntfy，这条链路不经过被墙的节点。
#
# 定时不用 GitHub 的 schedule（fork 仓库上经常不触发/延迟很久），
# 改由国内服务器的 crontab 每 10 分钟调 workflow_dispatch 触发：
#   /home/zhangsan/bin/xwatch-trigger.sh   （*/10 * * * *)
on:
  workflow_dispatch:
    inputs:
      test:
        description: "只发一条自检消息，验证 Actions -> ntfy 链路"
        type: boolean
        default: false
      dry_run:
        description: "只抓取打印，不推送（调试用）"
        type: boolean
        default: false
      test_image:
        description: "推一条带图的推文，验证图片能不能显示"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: xwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Scan & push
        env:
          NTFY_URL: ${{ vars.NTFY_URL || 'http://112.74.95.74:8858' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'xtweet-9f4bq2wp' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          XWATCH_TRANSLATE: ${{ vars.XWATCH_TRANSLATE || 'true' }}
          XWATCH_TEST: ${{ inputs.test && 'true' || (inputs.test_image && 'image' || 'false') }}
          XWATCH_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python xwatch.py

      - name: Persist state
        if: ${{ !inputs.test && !inputs.test_image && !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "xwatch-bot"
          git config user.email "xwatch-bot@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): xwatch $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3; do
            if git push; then echo "state pushed"; exit 0; fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "state push 失败（不影响本轮推送）"
